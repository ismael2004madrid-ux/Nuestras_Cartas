
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuestras cartas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
  --paper:#010b33;
  --card:#0a1540;
  --green:#7ee68c;
  --sage:#41558a;
  --ink:#eef2ff;
  --muted:#aeb9dd;
  --line:#263662;
  --light:#f1f3ff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--paper);
  color:var(--ink);
  font:italic 700 16px/1.65 'Domine',Georgia,serif;
}

body{
  overflow-x:hidden;
}

/* =========================================================
   LUCIÉRNAGAS BLANCAS
   ========================================================= */

.fireflies{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:4;
}

.firefly{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#ffffff;
  opacity:0;
  box-shadow:0 0 6px 2px rgba(255,255,255,.65),0 0 16px 4px rgba(255,255,255,.3);
  animation:firefly-drift 12s ease-in-out infinite;
}

.firefly:nth-child(1){left:8%;top:22%;animation-delay:-2s;animation-duration:14s}
.firefly:nth-child(2){left:19%;top:68%;animation-delay:-8s;animation-duration:17s}
.firefly:nth-child(3){left:31%;top:38%;animation-delay:-5s;animation-duration:13s}
.firefly:nth-child(4){left:43%;top:82%;animation-delay:-11s;animation-duration:16s}
.firefly:nth-child(5){left:56%;top:19%;animation-delay:-7s;animation-duration:15s}
.firefly:nth-child(6){left:67%;top:58%;animation-delay:-3s;animation-duration:18s}
.firefly:nth-child(7){left:78%;top:32%;animation-delay:-10s;animation-duration:14s}
.firefly:nth-child(8){left:91%;top:73%;animation-delay:-6s;animation-duration:16s}
.firefly:nth-child(9){left:13%;top:89%;animation-delay:-12s;animation-duration:19s}
.firefly:nth-child(10){left:84%;top:11%;animation-delay:-4s;animation-duration:15s}
.firefly:nth-child(11){left:49%;top:48%;animation-delay:-9s;animation-duration:17s}
.firefly:nth-child(12){left:73%;top:91%;animation-delay:-1s;animation-duration:13s}

@keyframes firefly-drift{
  0%,100%{opacity:0;transform:translate3d(0,0,0) scale(.65)}
  15%,35%{opacity:.8}
  50%{opacity:.35;transform:translate3d(22px,-30px,0) scale(1)}
  70%{opacity:.75;transform:translate3d(-12px,-48px,0) scale(.8)}
  85%{opacity:0}
}

/* =========================================================
   CAPAS PRINCIPALES
   ========================================================= */

.hero,
main{
  position:relative;
  z-index:auto;
}

/* =========================================================
   CABECERA + GIF SUPERIOR
   ========================================================= */

.hero{
  position:relative;
  width:100%;
  height:330px;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.hero-gif{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center center;
  clip-path:inset(0 0 30%);

  z-index:0;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;

  background:rgba(1,11,51,.10);

  z-index:1;
  pointer-events:none;
}

.head{
  position:relative;
  z-index:4;

  width:min(760px,100%);
  padding:30px 22px 20px;

  text-align:center;
  margin:0 auto;
}

.head h1{
  position:relative;
  z-index:3;
  font-size:clamp(28px,5vw,48px);
  line-height:1.2;
  letter-spacing:.045em;
  font-weight:500;
  font-style:italic;
  margin:0;
  color:#F0E9DA;
  text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 28px rgba(0,0,0,.75);
}

.head p{
  position:relative;
  z-index:3;
  font-size:13px;
  color:#e0e7d3;
  font-style:italic;
  margin:14px 0 0;
  letter-spacing:.02em;
  text-shadow:0 2px 9px rgba(0,0,0,.98),0 0 18px rgba(0,0,0,.85);
}

.flower-mark{
  color:#D7C9A9;
  font-size:.78em;
  vertical-align:10%;
}

/* =========================================================
   CONTENIDO
   ========================================================= */

main{
  max-width:760px;
  margin:auto;
  padding:0 22px 20px;
}

.actions{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin:34px 0 32px;
}

.btn{
  font:inherit;
  font-size:14px;
  color:var(--ink);
  background:transparent;
  border:1px solid var(--sage);
  border-radius:999px;
  padding:11px 22px;
  cursor:pointer;
  transition:.2s;
  text-decoration:none;
  display:inline-block;
}

.btn:hover{
  background:#101e4d;
}

.btn:disabled{
  opacity:.55;
  cursor:wait;
}

/* =========================================================
   CARTAS Y CÁPSULAS
   ========================================================= */

.letters{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.letter{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:8px;
  overflow:hidden;
}

.letter summary{
  list-style:none;
  cursor:pointer;
  padding:20px;
  min-height:130px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:12px;
}

.letter summary::-webkit-details-marker{
  display:none;
}

.envtop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.envicon{
  color:var(--green);
  font-size:28px;
}

/* Reloj de arena de las cápsulas */

.hourglass-icon{
  width:28px;
  height:28px;
  display:block;
  flex-shrink:0;
}

.date{
  font-size:12px;
  color:var(--muted);
}

.subject{
  font-size:15px;
  color:var(--ink);
}

.signature-preview{
  font-size:12px;
  color:var(--muted);
  font-weight:400;
  font-style:italic;
  margin-top:2px;
}

.letter[open] summary{
  border-bottom:1px solid var(--line);
}

.letterbody{
  padding:22px;
  background:#050f38;
  color:#e7ebfa;
  font-weight:400;
  font-style:normal;
  white-space:pre-wrap;
}

.sign{
  margin-top:18px;
  text-align:right;
  color:var(--green);
  font-weight:700;
  font-style:italic;
}

/* Mensaje de cápsula sellada */

.sealed-message{
  padding:25px 22px;
  text-align:center;
  color:var(--green);
  font-size:14px;
  font-style:italic;
  background:#050f38;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:36px 10px;
  grid-column:1/-1;
  font-size:14px;
}

/* =========================================================
   BOTÓN VOLVER
   ========================================================= */

.back{
  display:flex;
  justify-content:center;
  margin:52px 0 10px;
  position:relative;
  z-index:3;
}

/* =========================================================
   ESCENA INFERIOR
   ========================================================= */

.bottom-scene{
  position:relative;
  width:100%;
  height:220px;
  margin-top:-150px;
  overflow:hidden;
  z-index:1;
  pointer-events:none;
  background:var(--paper);
}

.bottom-gif{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  height:auto;
  max-width:none;
  display:block;
  image-rendering:pixelated;
}

/* =========================================================
   FORMULARIO
   ========================================================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,4,22,.78);
  padding:20px;
  align-items:center;
  justify-content:center;
  z-index:5;
}

.overlay.show{
  display:flex;
}

.formcard{
  width:min(100%,540px);
  max-height:90vh;
  overflow:auto;
  background:#07123d;
  border:1px solid var(--line);
  border-radius:12px;
  padding:28px;
  box-shadow:0 18px 60px rgba(0,0,0,.45);
}

.formhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.formhead h2{
  font-size:22px;
  margin:0;
  color:var(--ink);
}

.close{
  border:0;
  background:none;
  color:var(--green);
  font:inherit;
  font-size:24px;
  cursor:pointer;
}

.field{
  display:block;
  margin:17px 0 7px;
  color:var(--ink);
}

.formcard input,
.formcard textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:6px;
  background:#020c32;
  padding:12px;
  color:var(--ink);
  font:400 15px/1.6 'Domine',Georgia,serif;
}

.formcard input::placeholder,
.formcard textarea::placeholder{
  color:#7785ad;
}

.formcard textarea{
  min-height:170px;
  resize:vertical;
}

.formbuttons{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:20px;
}

.hint{
  font:400 12px/1.5 'Domine',Georgia,serif;
  color:var(--muted);
  margin-top:12px;
}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#172b68;
  color:#f1f3ff;
  padding:10px 16px;
  border:1px solid #354b83;
  border-radius:99px;
  font:400 13px 'Domine',Georgia,serif;
  display:none;
  z-index:10;
  max-width:calc(100% - 30px);
  text-align:center;
}

.toast.show{
  display:block;
}

/* =========================================================
   MÓVIL
   ========================================================= */

@media(max-width:520px){

  .hero{
    height:285px;
  }

  .hero-gif{
    object-position:center center;
  }

  .head{
    padding:24px 18px 18px;
  }

  .head h1{
    font-size:21px;
    margin-bottom:9px;
  }

  .head p{
    font-size:12px;
    line-height:1.6;
  }

  main{
    padding:0 22px 20px;
  }

  .actions{
    margin:30px 0;
    gap:9px;
  }

  .actions .btn{
    font-size:12px;
    padding:10px 14px;
  }

  .letters{
    grid-template-columns:1fr;
  }

  .letter summary{
    min-height:110px;
  }

  .bottom-scene{
    height:220px;
    margin-top:-130px;
  }

  .bottom-gif{
    width:100%;
    height:auto;
  }

  .back{
    margin-top:48px;
  }

  .formcard{
    padding:22px;
  }

  .formhead h2{
    font-size:19px;
  }
}

/* =========================================================
   RESPETO A REDUCCIÓN DE MOVIMIENTO
   ========================================================= */

@media(prefers-reduced-motion:reduce){
  .firefly{display:none}
}

</style>
</head>

<body>

<!-- =======================================================
     FONDO DINÁMICO
     ======================================================= -->

<div class="fireflies" aria-hidden="true"><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span></div>

<!-- =======================================================
     GIF SUPERIOR + CABECERA
     ======================================================= -->

<section class="hero">

  <img
    class="hero-gif"
    src="fondo-cartas.gif"
    alt=""
    aria-hidden="true"
  >

  <header class="head">
    <h1>NUESTRAS <span class="flower-mark">✉︎</span> CARTAS</h1>

    <p>
      Para esas palabras que son importantes, y queremos que el otro encuentre algún día.
    </p>
  </header>

</section>

<!-- =======================================================
     CONTENIDO
     ======================================================= -->

<main>

  <div class="actions">

    <button
      class="btn"
      id="openForm"
      type="button"
    >
      ＋ Escribir una carta
    </button>

    <button
      class="btn"
      id="openCapsule"
      type="button"
    >
      ＋ Cápsula del tiempo
    </button>

  </div>

  <section
    class="letters"
    id="letters"
    aria-live="polite"
  >

    <p class="empty">
      Cargando vuestras cartas…
    </p>

  </section>

  <!-- BOTÓN VOLVER -->

  <div class="back">

    <a
      class="btn"
      href="https://blancamia.wordpress.com"
    >
      ← Volver
    </a>

  </div>

</main>

<!-- =======================================================
     GIF INFERIOR
     ======================================================= -->

<section class="bottom-scene">

  <img
    class="bottom-gif"
    src="kirby_stars_transparent.gif"
    alt=""
    aria-hidden="true"
  >

</section>

<!-- =======================================================
     FORMULARIO
     ======================================================= -->

<div
  class="overlay"
  id="overlay"
>

  <form
    class="formcard"
    id="letterForm"
  >

    <div class="formhead">

      <h2 id="formTitle">
        Escribir una carta
      </h2>

      <button
        type="button"
        class="close"
        id="closeForm"
        aria-label="Cerrar"
      >
        ×
      </button>

    </div>

    <label
      class="field"
      for="title"
      id="titleLabel"
    >
      Título de la carta
    </label>

    <input
      id="title"
      name="title"
      type="text"
      placeholder="Ponle un título a tu carta"
      maxlength="70"
      required
    >

    <label
      class="field"
      for="date"
      id="dateLabel"
    >
      ¿Qué día escribes esto?
    </label>

    <input
      id="date"
      name="date"
      type="date"
      required
    >

    <label
      class="field"
      for="message"
      id="messageLabel"
    >
      Escribe tu carta
    </label>

    <textarea
      id="message"
      name="message"
      placeholder="Escribe aquí todo lo que quieras contar…"
      required
    ></textarea>

    <label
      class="field"
      for="signature"
    >
      Firma
    </label>

    <input
      id="signature"
      name="signature"
      type="text"
      placeholder="Tu firma"
      required
    >

    <p class="hint" id="formHint">
      Al guardar, la carta aparecerá la primera en el buzón.
    </p>

    <div class="formbuttons">

      <button
        type="button"
        class="btn"
        id="cancel"
      >
        Cancelar
      </button>

      <button
        class="btn"
        type="submit"
        id="submitButton"
      >
        Guardar carta ♡
      </button>

    </div>

  </form>

</div>

<div
  class="toast"
  id="toast"
>
  Carta guardada en vuestro buzón ♡
</div>

<script>

(()=>{

  const SUPABASE_URL="https://opswexuksplsysgtmajz.supabase.co";

  const SUPABASE_ANON_KEY="sb_publishable_OJ4xv5YVnCyLNA6L9P8D4w_M4s2AkBz";

  const API_URL=`${SUPABASE_URL}/rest/v1/letters`;

  const headers={
    apikey:SUPABASE_ANON_KEY,
    Authorization:`Bearer ${SUPABASE_ANON_KEY}`
  };

  const overlay=document.getElementById('overlay');
  const form=document.getElementById('letterForm');
  const letters=document.getElementById('letters');

  const formTitle=document.getElementById('formTitle');
  const titleLabel=document.getElementById('titleLabel');
  const titleInput=document.getElementById('title');
  const dateLabel=document.getElementById('dateLabel');
  const dateInput=document.getElementById('date');
  const messageLabel=document.getElementById('messageLabel');
  const messageInput=document.getElementById('message');
  const formHint=document.getElementById('formHint');
  const submitButton=document.getElementById('submitButton');

  let savedLetters=[];
  let currentEntryType='letter';

  /* =======================================================
     FECHAS
     ======================================================= */

  function getLocalDateISO(){

    const now=new Date();

    const year=now.getFullYear();
    const month=String(now.getMonth()+1).padStart(2,'0');
    const day=String(now.getDate()).padStart(2,'0');

    return `${year}-${month}-${day}`;

  }

  function formatDate(value){

    if(!value)return '';

    const parts=value.split('-');

    return `${parts[2]}/${parts[1]}/${parts[0]}`;

  }

  function isCapsuleSealed(item){

    return item.isCapsule && item.date>getLocalDateISO();

  }


/* =======================================================
   CREACIÓN DE TARJETAS
   ======================================================= */

function makeCard(item){

  const card=document.createElement('details');

  card.className='letter';

  const summary=document.createElement('summary');

  const top=document.createElement('div');

  top.className='envtop';

  let icon=document.createElement('span');

  const sealed=isCapsuleSealed(item);

  if(item.isCapsule){

    const hourglass=document.createElementNS(
      'http://www.w3.org/2000/svg',
      'svg'
    );

    hourglass.setAttribute('viewBox','0 0 24 24');
    hourglass.setAttribute('fill','none');
    hourglass.setAttribute('stroke','currentColor');
    hourglass.setAttribute('stroke-width','1.7');
    hourglass.setAttribute('stroke-linecap','round');
    hourglass.setAttribute('stroke-linejoin','round');
    hourglass.setAttribute('class','envicon hourglass-icon');
    hourglass.setAttribute('aria-label','Cápsula del tiempo');
    hourglass.setAttribute('role','img');

    const paths=[
      'M5 22h14',
      'M5 2h14',
      'm17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22',
      'M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2'
    ];

    paths.forEach(d=>{
      const path=document.createElementNS(
        'http://www.w3.org/2000/svg',
        'path'
      );
      path.setAttribute('d',d);
      hourglass.append(path);
    });

    icon=hourglass;

  }else{

    icon.className='envicon';
    icon.textContent='✉';
    icon.setAttribute('aria-label','Carta');

  }

  const dt=document.createElement('span');

  dt.className='date';
  dt.textContent=formatDate(item.date);

  top.append(icon,dt);

  const subject=document.createElement('span');

  subject.className='subject';
  subject.textContent=item.title;

  summary.append(
    top,
    subject
  );

  /* La firma aparece siempre en la vista previa */

  const signaturePreview=document.createElement('span');

  signaturePreview.className='signature-preview';
  signaturePreview.textContent='— '+item.signature;

  summary.append(signaturePreview);

  const body=document.createElement('div');

  if(sealed){

    body.className='sealed-message';
    body.textContent='La cápsula del tiempo está sellada ♡';

  }else{

    body.className='letterbody';

    body.append(
      document.createTextNode(item.message)
    );

    const sign=document.createElement('div');

    sign.className='sign';
    sign.textContent='— '+item.signature;

    body.append(sign);

  }

  card.append(
    summary,
    body
  );

  return card;

}


  /* =======================================================
     MOSTRAR CARTAS Y CÁPSULAS
     ======================================================= */

  function renderLetters(){

    letters.replaceChildren();

    if(!savedLetters.length){

      const empty=document.createElement('p');

      empty.className='empty';

      empty.textContent='Todavía no hay cartas. Podéis escribir la primera ♡';

      letters.append(empty);

      return;

    }

    savedLetters.forEach(
      item=>letters.append(
        makeCard(item)
      )
    );

  }

  /* =======================================================
     CARGAR DATOS DE SUPABASE
     ======================================================= */

  async function fetchLetters(){

    letters.innerHTML=
      '<p class="empty">Cargando vuestras cartas…</p>';

    try{

      const response=await fetch(

        `${API_URL}?select=id,title,letter_date,message,signature,is_capsule,created_at&order=created_at.desc`,

        {
          headers:{
            ...headers,
            Accept:'application/json'
          }
        }

      );

      if(!response.ok){

        const detail=await response.text();

        throw new Error(
          `Supabase (${response.status}): ${detail}`
        );

      }

      const data=await response.json();

      savedLetters=data.map(row=>({

        id:row.id,

        title:row.title,

        date:row.letter_date,

        message:row.message,

        signature:row.signature,

        isCapsule:row.is_capsule===true,

        createdAt:new Date(
          row.created_at
        ).getTime()

      }));

      renderLetters();

    }catch(error){

      letters.innerHTML=
        '<p class="empty">No se han podido cargar las cartas. Comprueba la conexión e inténtalo de nuevo.</p>';

      console.error(
        'Error al cargar las cartas:',
        error
      );

    }

  }

  /* =======================================================
     ABRIR Y CERRAR FORMULARIO
     ======================================================= */

  function show(){

    overlay.classList.add('show');

  }

  function hide(){

    overlay.classList.remove('show');

  }

  function openEntryForm(type){

    currentEntryType=type;

    form.reset();

    if(type==='capsule'){

      formTitle.textContent='Crear una cápsula del tiempo';

      titleLabel.textContent='Título de la cápsula';

      titleInput.placeholder='Ponle un título a tu cápsula';

      dateLabel.textContent='¿Cuándo quieres que se abra?';

      dateInput.min=getLocalDateISO();

      messageLabel.textContent='Escribe el mensaje que quieres guardar';

      messageInput.placeholder='Este mensaje permanecerá oculto hasta la fecha elegida…';

      formHint.textContent='La cápsula permanecerá sellada hasta el día que hayas elegido.';

      submitButton.textContent='Guardar cápsula ♡';

    }else{

      formTitle.textContent='Escribir una carta';

      titleLabel.textContent='Título de la carta';

      titleInput.placeholder='Ponle un título a tu carta';

      dateLabel.textContent='¿Qué día escribes esto?';

      dateInput.removeAttribute('min');

      messageLabel.textContent='Escribe tu carta';

      messageInput.placeholder='Escribe aquí todo lo que quieras contar…';

      formHint.textContent='Al guardar, la carta aparecerá la primera en el buzón.';

      submitButton.textContent='Guardar carta ♡';

    }

    show();

  }

  /* =======================================================
     BOTONES DE APERTURA
     ======================================================= */

  document
    .getElementById('openForm')
    .addEventListener(
      'click',
      ()=>openEntryForm('letter')
    );

  document
    .getElementById('openCapsule')
    .addEventListener(
      'click',
      ()=>openEntryForm('capsule')
    );

  document
    .getElementById('closeForm')
    .addEventListener(
      'click',
      hide
    );

  document
    .getElementById('cancel')
    .addEventListener(
      'click',
      hide
    );

  overlay.addEventListener(
    'click',
    e=>{
      if(e.target===overlay){
        hide();
      }
    }
  );

  /* =======================================================
     GUARDAR CARTAS Y CÁPSULAS
     ======================================================= */

  form.addEventListener(
    'submit',
    async e=>{

      e.preventDefault();

      if(!form.reportValidity())return;

      if(
        currentEntryType==='capsule' &&
        dateInput.value<getLocalDateISO()
      ){

        alert('Elige una fecha de hoy o posterior para abrir la cápsula.');

        return;

      }

      submitButton.disabled=true;

      submitButton.textContent='Guardando…';

      const item={

        title:
          titleInput.value.trim(),

        letter_date:
          dateInput.value,

        message:
          messageInput.value.trim(),

        signature:
          document
            .getElementById('signature')
            .value
            .trim(),

        is_capsule:
          currentEntryType==='capsule'

      };

      try{

        const response=await fetch(

          API_URL,

          {

            method:'POST',

            headers:{
              ...headers,
              'Content-Type':'application/json',
              Prefer:'return=minimal'
            },

            body:JSON.stringify(item)

          }

        );

        if(!response.ok){

          const detail=await response.text();

          throw new Error(
            `Supabase (${response.status}): ${detail}`
          );

        }

        form.reset();

        hide();

        await fetchLetters();

        const toast=document.getElementById('toast');

        toast.textContent=
          item.is_capsule
            ? 'Cápsula guardada y sellada ♡'
            : 'Carta guardada en vuestro buzón ♡';

        toast.classList.add('show');

        setTimeout(
          ()=>{
            toast.classList.remove('show');
          },
          2400
        );

      }catch(error){

        console.error(
          'Error al guardar:',
          error
        );

        alert(
          'No se ha podido guardar. Comprueba la conexión e inténtalo de nuevo.'
        );

      }finally{

        submitButton.disabled=false;

        submitButton.textContent=
          currentEntryType==='capsule'
            ? 'Guardar cápsula ♡'
            : 'Guardar carta ♡';

      }

    }
  );

  /* =======================================================
     ACTUALIZAR ESTADO DE CÁPSULAS
     ======================================================= */

  fetchLetters();

})();

</script>

</body>
</html>
