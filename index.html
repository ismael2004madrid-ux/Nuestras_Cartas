
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuestras cartas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
  --paper:#010b33;
  --card:#0a1540;
  --green:#7ee68c;
  --sage:#41558a;
  --ink:#eef2ff;
  --muted:#aeb9dd;
  --line:#263662;
  --light:#f1f3ff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--paper);
  color:var(--ink);
  font:italic 700 16px/1.65 'Domine',Georgia,serif;
}

body{
  overflow-x:hidden;
}

/* =========================================================
   LUCIÉRNAGAS BLANCAS
   ========================================================= */

.fireflies{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:4;
}

.firefly{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#8fbce8;
  opacity:0;
  box-shadow:0 0 6px 2px rgba(143,188,232,.5),0 0 16px 4px rgba(143,188,232,.22);
  animation:firefly-drift 12s ease-in-out infinite;
}

.firefly:nth-child(1){left:8%;top:22%;animation-delay:-2s;animation-duration:14s}
.firefly:nth-child(2){left:19%;top:68%;animation-delay:-8s;animation-duration:17s}
.firefly:nth-child(3){left:31%;top:38%;animation-delay:-5s;animation-duration:13s}
.firefly:nth-child(4){left:43%;top:82%;animation-delay:-11s;animation-duration:16s}
.firefly:nth-child(5){left:56%;top:19%;animation-delay:-7s;animation-duration:15s}
.firefly:nth-child(6){left:67%;top:58%;animation-delay:-3s;animation-duration:18s}
.firefly:nth-child(7){left:78%;top:32%;animation-delay:-10s;animation-duration:14s}
.firefly:nth-child(8){left:91%;top:73%;animation-delay:-6s;animation-duration:16s}
.firefly:nth-child(9){left:13%;top:89%;animation-delay:-12s;animation-duration:19s}
.firefly:nth-child(10){left:84%;top:11%;animation-delay:-4s;animation-duration:15s}
.firefly:nth-child(11){left:49%;top:48%;animation-delay:-9s;animation-duration:17s}
.firefly:nth-child(12){left:73%;top:91%;animation-delay:-1s;animation-duration:13s}

@keyframes firefly-drift{
  0%,100%{opacity:0;transform:translate3d(0,0,0) scale(.65)}
  15%,35%{opacity:.8}
  50%{opacity:.35;transform:translate3d(22px,-30px,0) scale(1)}
  70%{opacity:.75;transform:translate3d(-12px,-48px,0) scale(.8)}
  85%{opacity:0}
}

/* =========================================================
   CAPAS PRINCIPALES
   ========================================================= */

.hero,
main{
  position:relative;
  z-index:auto;
}

/* =========================================================
   CABECERA + GIF SUPERIOR
   ========================================================= */

.hero{
  position:relative;
  isolation:isolate;
  width:100%;
  min-height:430px;
  padding:76px 20px 0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
}
.hero-gif{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
  z-index:0;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;

  background:rgba(1,11,51,.10);

  z-index:1;
  pointer-events:none;
}

.head{
  position:relative;
  z-index:4;
  width:auto;
  padding:0;
  text-align:center;
  margin:0 auto;
}
.head h1{
  position:relative;
  top:5px;
  z-index:3;
  font-size:clamp(27px,calc(5vw - 1px),47px);
  line-height:1.2;
  letter-spacing:.045em;
  font-weight:500;
  font-style:italic;
  margin:0;
  color:#d8eaff;
  text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 28px rgba(0,0,0,.75);
}

.head p{
  position:relative;
  z-index:3;
  font-size:13px;
  color:#d8eaff;
  font-style:italic;
  margin:14px 0 0;
  letter-spacing:.02em;
  text-shadow:0 2px 9px rgba(0,0,0,.98),0 0 18px rgba(0,0,0,.85);
}

.flower-mark{
  color:var(--gold);
  font-size:.78em;
  vertical-align:10%;
}

/* =========================================================
   CONTENIDO
   ========================================================= */

main{
  max-width:760px;
  margin:auto;
  padding:0 22px 20px;
}

.actions{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin:34px 0 32px;
}

.btn{
  font:inherit;
  font-size:14px;
  color:var(--ink);
  background:transparent;
  border:1px solid var(--sage);
  border-radius:999px;
  padding:11px 22px;
  cursor:pointer;
  transition:.2s;
  text-decoration:none;
  display:inline-block;
}

.btn:hover{
  background:#101e4d;
}

.btn:disabled{
  opacity:.55;
  cursor:wait;
}

/* =========================================================
   CARTAS Y CÁPSULAS
   ========================================================= */

.letters{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.letter{
  position:relative;
  border:1px solid rgba(89,119,178,.72);
  background:linear-gradient(145deg,rgba(17,34,83,.97),rgba(7,20,60,.96));
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 8px 22px rgba(0,0,0,.16);
  transition:border-color .3s,box-shadow .3s,transform .3s;
}
.letter:hover{border-color:rgba(126,230,140,.58);box-shadow:0 12px 28px rgba(0,0,0,.24);transform:translateY(-2px)}
.letter summary{
  position:relative;
  isolation:isolate;
  list-style:none;
  cursor:pointer;
  padding:15px 16px 17px;
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(135deg,rgba(28,48,105,.8),rgba(7,20,60,.18));
}
.letter summary::after{
  content:"";
  position:absolute;
  z-index:2;
  top:0;
  left:0;
  width:100%;
  height:58%;
  background:linear-gradient(180deg,rgba(126,230,140,.13),rgba(65,85,138,.12));
  border-bottom:1px solid rgba(126,230,140,.2);
  clip-path:polygon(0 0,100% 0,50% 62%);
  transform-origin:top center;
  transition:transform .48s cubic-bezier(.2,.75,.25,1),opacity .3s;
  pointer-events:none;
}
.letter[open] summary::after{transform:rotateX(180deg);opacity:.35}
.letter summary>*{position:relative;z-index:1}

.letter summary::-webkit-details-marker{
  display:none;
}

.envtop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:44px;
  position:relative;
  z-index:3;
}
.envsymbols{display:flex;align-items:center;gap:9px;min-width:0}
.stamp-frame{width:44px;height:44px;padding:5px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 4px 4px,transparent 2px,rgba(126,230,140,.95) 2.5px) 0 0/8px 8px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))}
.stamp-frame img{display:block;width:34px;height:34px;object-fit:cover;border:1px solid rgba(126,230,140,.55);background:#0a1540}

.envicon{
  color:var(--green);
  font-size:25px;
}

/* Reloj de arena de las cápsulas */

.hourglass-icon{
  width:28px;
  height:28px;
  display:block;
  flex-shrink:0;
}

.date{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.04em;
}

.subject{
  font-size:16px;
  line-height:1.35;
  color:var(--ink);
  margin:8px 0 2px;
}

.signature-preview{
  font-size:12px;
  color:var(--muted);
  font-weight:400;
  font-style:italic;
  margin-top:auto;
  align-self:flex-end;
}

.letter[open] summary{border-bottom:1px solid rgba(126,230,140,.24)}
.envicon{transition:transform .45s cubic-bezier(.2,.75,.25,1),color .3s}
.letter[open] .envicon{transform:rotateX(180deg) scale(1.12);color:#b8f5bd}
.letterbody{
  padding:22px;
  background:linear-gradient(155deg,#07143d,#050f38);
  color:#e7ebfa;
  font-weight:400;
  font-style:normal;
  white-space:pre-wrap;
}
.letter[open] .letterbody,.letter[open] .sealed-message{animation:letter-unfold .48s cubic-bezier(.2,.75,.25,1) both}
@keyframes letter-unfold{from{opacity:0;transform:translateY(-12px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:translateY(0);clip-path:inset(0 0 0 0)}}

.sign{
  margin-top:18px;
  text-align:right;
  color:var(--green);
  font-weight:700;
  font-style:italic;
}

/* Mensaje de cápsula sellada */

.sealed-message{
  padding:25px 22px;
  text-align:center;
  color:var(--green);
  font-size:14px;
  font-style:italic;
  background:#050f38;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:36px 10px;
  grid-column:1/-1;
  font-size:14px;
}

/* =========================================================
   BOTÓN VOLVER
   ========================================================= */

.back{
  display:flex;
  justify-content:center;
  margin:52px 0 10px;
  position:relative;
  z-index:3;
}
.back .btn{display:inline-block;margin-top:12px;padding:10px 22px;border:1px solid var(--sage);border-radius:999px;color:var(--ink);background:transparent;text-decoration:none;font:inherit;font-size:13px;transition:background .2s,border-color .2s}
.back .btn:hover{background:var(--green);border-color:var(--green)}
.back .btn:focus-visible{outline:2px solid var(--green);outline-offset:4px}

/* =========================================================
   FORMULARIO
   ========================================================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,4,22,.76);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  padding:22px;
  align-items:center;
  justify-content:center;
  z-index:20;
}
.overlay.show{display:flex;animation:modalFade .2s ease}
.formcard{
  position:relative;
  width:min(100%,540px);
  max-height:min(88vh,760px);
  overflow:auto;
  background:linear-gradient(145deg,#0d1b4a,#07123d);
  border:1px solid rgba(126,230,140,.3);
  border-radius:3px;
  padding:25px 30px 30px;
  box-shadow:0 25px 80px rgba(0,0,0,.42);
  animation:modalRise .28s ease;
}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
@keyframes modalRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.formhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.formhead h2{
  font-size:22px;
  margin:0;
  color:#eef2ff;
  font-weight:500;
  font-style:italic;
}

.close{
  border:0;
  background:none;
  color:#aeb9dd;
  font:inherit;
  font-size:25px;
  line-height:1;
  cursor:pointer;
  transition:color .2s,transform .2s;
}
.close:hover{color:#7ee68c;transform:rotate(90deg)}

.field{
  display:block;
  margin:17px 0 7px;
  color:#c7d2f2;
  font-size:13px;
  font-style:italic;
}

.formcard input,
.formcard textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:6px;
  background:#020c32;
  padding:12px;
  color:var(--ink);
  font:400 15px/1.6 'Domine',Georgia,serif;
}

.formcard input::placeholder,
.formcard textarea::placeholder{
  color:#7785ad;
}
.formcard input:focus,.formcard textarea:focus{outline:2px solid rgba(126,230,140,.38);outline-offset:1px;border-color:#7ee68c}

.formcard textarea{
  min-height:170px;
  resize:vertical;
}

.formbuttons{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:20px;
}
.formbuttons .btn{min-width:170px;text-align:center}
.formcard input[type=file]{width:100%;padding:9px;border:1px dashed rgba(126,230,140,.42);border-radius:5px;background:rgba(2,12,50,.55);color:var(--muted);font:400 12px 'Domine',Georgia,serif}
.formcard input[type=file]::file-selector-button{margin-right:10px;padding:7px 10px;border:1px solid var(--sage);border-radius:999px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.formcard input[type=file]::file-selector-button:hover{background:#101e4d}
.stamp-preview{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:11px}
.stamp-preview[hidden]{display:none}
.stamp-preview img{width:48px;height:48px;object-fit:cover;padding:4px;border:1px dashed rgba(126,230,140,.65);background:#0a1540;border-radius:3px}

.hint{
  font:400 12px/1.5 'Domine',Georgia,serif;
  color:var(--muted);
  margin-top:12px;
}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#172b68;
  color:#f1f3ff;
  padding:10px 16px;
  border:1px solid #354b83;
  border-radius:99px;
  font:400 13px 'Domine',Georgia,serif;
  display:none;
  z-index:10;
  max-width:calc(100% - 30px);
  text-align:center;
}

.toast.show{
  display:block;
}

/* =========================================================
   MÓVIL
   ========================================================= */

@media(max-width:760px){
  .hero{
    min-height:390px;
    padding:65px 12px 43px;
  }
}

@media(max-width:520px){

  .hero{
    min-height:56.4vw;
    padding:58px 5px 38px;
  }

  .hero-gif{
    object-position:center bottom;
  }

  .head p{
    font-size:12px;
  }

  main{
    padding:0 22px 20px;
  }

  .actions{
    margin:30px 0;
    gap:9px;
  }

  .actions .btn{
    font-size:12px;
    padding:10px 14px;
  }

  .letters{
    grid-template-columns:1fr;
  }

  .letter summary{
    min-height:125px;
    padding:13px 12px 14px;
  }

  .back{
    margin-top:48px;
  }

  .formcard{
    padding:22px;
  }

  .formhead h2{
    font-size:19px;
  }
}

/* =========================================================
   RESPETO A REDUCCIÓN DE MOVIMIENTO
   ========================================================= */

@media(prefers-reduced-motion:reduce){
  .firefly{display:none}
  .letter,.letter summary::after,.envicon{transition:none!important}
  .letter[open] .letterbody,.letter[open] .sealed-message{animation:none!important}
  .overlay.show,.formcard{animation:none!important}
}

</style>
</head>

<!-- =======================================================
     FONDO DINÁMICO

<div class="fireflies" aria-hidden="true"><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span></div>

<!-- =======================================================

<div

>

  <form

  >

    <div class="formhead">

</div>

<div

  id="toast"

</div>

    hourglass.setAttribute('stroke-width','1.7');
    hourglass.setAttribute('stroke-linecap','round');
    hourglass.setAttribute('stroke-linejoin','round');
    hourglass.setAttribute('class','envicon hourglass-icon');
    hourglass.setAttribute('aria-label','Cápsula del tiempo');
    hourglass.setAttribute('role','img');

    const paths=[
      'M5 22h14',
      'M5 2h14',
      'm17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22',
      'M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2'
    ];

    paths.forEach(d=>{
      const path=document.createElementNS(
        'http://www.w3.org/2000/svg',
        'path'
      );
      path.setAttribute('d',d);
      hourglass.append(path);
    });

    icon=hourglass;

  }else{

    icon.className='envicon';
    icon.textContent='✉';
    icon.setAttribute('aria-label','Carta');

  }

  const symbols=document.createElement('div');
  symbols.className='envsymbols';
  if(item.stampPath){
    const stampFrame=document.createElement('span');
    stampFrame.className='stamp-frame';
    const stamp=document.createElement('img');
    stamp.src=storageClient.storage.from(STAMP_BUCKET).getPublicUrl(item.stampPath).data.publicUrl;
    stamp.alt='Sello de la carta';
    stamp.loading='lazy';
    stampFrame.append(stamp);
    symbols.append(stampFrame);
  }
  symbols.append(icon);

  const dt=document.createElement('span');
  dt.className='date';
  dt.textContent=formatDate(item.date);

  top.append(symbols,dt);

  const subject=document.createElement('span');

  subject.className='subject';
  subject.textContent=item.title;

  summary.append(
    top,
    subject
  );

  /* La firma aparece siempre en la vista previa */

  const signaturePreview=document.createElement('span');

  signaturePreview.className='signature-preview';
  signaturePreview.textContent='— '+item.signature;

  summary.append(signaturePreview);

  const body=document.createElement('div');

  if(sealed){

    body.className='sealed-message';
    body.textContent='La cápsula del tiempo está sellada ♡';

  }else{

    body.className='letterbody';

    body.append(
      document.createTextNode(item.message)
    );

    const sign=document.createElement('div');

    sign.className='sign';
    sign.textContent='— '+item.signature;

    body.append(sign);

  }

  card.append(
    summary,
    body
  );

  return card;

}


  /* =======================================================
     MOSTRAR CARTAS Y CÁPSULAS
     ======================================================= */

  function renderLetters(){

    letters.replaceChildren();

    if(!savedLetters.length){

      const empty=document.createElement('p');

      empty.className='empty';

      empty.textContent='Todavía no hay cartas. Podéis escribir la primera ♡';

      letters.append(empty);

      return;

    }

    savedLetters.forEach(
      item=>letters.append(
        makeCard(item)
      )
    );

  }

  /* =======================================================
     CARGAR DATOS DE SUPABASE
     ======================================================= */

  async function fetchLetters(){

    letters.innerHTML=
      '<p class="empty">Cargando vuestras cartas…</p>';

    try{

      const response=await fetch(

        `${API_URL}?select=id,title,letter_date,message,signature,is_capsule,stamp_path,created_at&order=created_at.desc`,

        {
          headers:{
            ...headers,
            Accept:'application/json'
          }
        }

      );

      if(!response.ok){

        const detail=await response.text();

        throw new Error(
          `Supabase (${response.status}): ${detail}`
        );

      }

      const data=await response.json();

      savedLetters=data.map(row=>({

        id:row.id,

        title:row.title,

        date:row.letter_date,

        message:row.message,

        signature:row.signature,

        isCapsule:row.is_capsule===true,

        stampPath:row.stamp_path||null,

        createdAt:new Date(
          row.created_at
        ).getTime()

      }));

      renderLetters();

    }catch(error){

      letters.innerHTML=
        '<p class="empty">No se han podido cargar las cartas. Comprueba la conexión e inténtalo de nuevo.</p>';

      console.error(
        'Error al cargar las cartas:',
        error
      );

    }

  }

  /* =======================================================
     ABRIR Y CERRAR FORMULARIO
     ======================================================= */

  function show(){

    overlay.classList.add('show');

  }

  function hide(){

    overlay.classList.remove('show');

  }

  function openEntryForm(type){

    currentEntryType=type;

    form.reset();
    clearStampPreview();

    if(type==='capsule'){

      stampLabel.textContent='Sello de la cápsula (opcional)';
      formTitle.textContent='Crea una cápsula del tiempo';

      titleLabel.textContent='Título de la cápsula';

      titleInput.placeholder='Ponle un título a tu cápsula';

      dateLabel.textContent='¿Cuándo quieres que se abra?';

      dateInput.min=getLocalDateISO();

      messageLabel.textContent='Escribe el mensaje que quieres guardar';

      messageInput.placeholder='Este mensaje permanecerá oculto hasta la fecha elegida…';

      formHint.textContent='La cápsula permanecerá sellada hasta el día que hayas elegido.';
      formHint.hidden=false;

      submitButton.textContent='Dejar cápsula ♡';

    }else{

      stampLabel.textContent='Sello de la carta (opcional)';
      formTitle.textContent='Escribe una carta';

      titleLabel.textContent='Título de la carta';

      titleInput.placeholder='Ponle un título a tu carta';

      dateLabel.textContent='¿Qué día escribes esto?';

      dateInput.removeAttribute('min');

      messageLabel.textContent='Escribe tu carta';

      messageInput.placeholder='Escribe aquí todo lo que quieras contar…';

      formHint.textContent='';
      formHint.hidden=true;

      submitButton.textContent='Dejar carta ♡';

    }

    show();

  }

  /* =======================================================
     BOTONES DE APERTURA
     ======================================================= */

  document
    .getElementById('openForm')
    .addEventListener(
      'click',
      ()=>openEntryForm('letter')
    );

  document
    .getElementById('openCapsule')
    .addEventListener(
      'click',
      ()=>openEntryForm('capsule')
    );

  document
    .getElementById('closeForm')
    .addEventListener(
      'click',
      hide
    );

  overlay.addEventListener(
    'click',
    e=>{
      if(e.target===overlay){
        hide();
      }
    }
  );

  /* =======================================================
     GUARDAR CARTAS Y CÁPSULAS
     ======================================================= */

  form.addEventListener(
    'submit',
    async e=>{

      e.preventDefault();

      if(!form.reportValidity())return;

      if(
        currentEntryType==='capsule' &&
        dateInput.value<getLocalDateISO()
      ){

        alert('Elige una fecha de hoy o posterior para abrir la cápsula.');

        return;

      }

      const stampFile=stampInput.files&&stampInput.files[0];
      const allowedStampTypes=['image/jpeg','image/png','image/webp','image/gif','image/heic','image/heif','image/avif'];
      if(stampFile&&(!allowedStampTypes.includes(stampFile.type)||stampFile.size>5*1024*1024)){
        alert('El sello debe ser una imagen compatible y no superar los 5 MB.');
        return;
      }

      submitButton.disabled=true;
      submitButton.textContent='Dejando…';

      const item={

        title:
          titleInput.value.trim(),

        letter_date:
          dateInput.value,

        message:
          messageInput.value.trim(),

        signature:
          document
            .getElementById('signature')
            .value
            .trim(),

        is_capsule:
          currentEntryType==='capsule',

        stamp_path:null

      };

      try{

        if(stampFile){
          const extension=({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/heic':'heic','image/heif':'heif','image/avif':'avif' })[stampFile.type];
          const unique=Date.now()+'-'+Math.random().toString(36).slice(2,10);
          const path='stamps/'+unique+'.'+extension;
          const {data:uploadedStamp,error:stampError}=await storageClient.storage.from(STAMP_BUCKET).upload(path,stampFile,{cacheControl:'3600',contentType:stampFile.type,upsert:false});
          if(stampError)throw stampError;
          item.stamp_path=uploadedStamp.path;
        }

        const response=await fetch(

          API_URL,

          {

            method:'POST',

            headers:{
              ...headers,
              'Content-Type':'application/json',
              Prefer:'return=minimal'
            },

            body:JSON.stringify(item)

          }

        );

        if(!response.ok){

          const detail=await response.text();

          throw new Error(
            `Supabase (${response.status}): ${detail}`
          );

        }

        form.reset();
        clearStampPreview();

        hide();

        await fetchLetters();

        const toast=document.getElementById('toast');

        toast.textContent=
          item.is_capsule
            ? 'Cápsula guardada y sellada ♡'
            : 'Carta guardada en vuestro buzón ♡';

        toast.classList.add('show');

        setTimeout(
          ()=>{
            toast.classList.remove('show');
          },
          2400
        );

      }catch(error){

        console.error(
          'Error al guardar:',
          error
        );

        alert(
          'No se ha podido guardar. Comprueba la conexión e inténtalo de nuevo.'
        );

      }finally{

        submitButton.disabled=false;

        submitButton.textContent=
          currentEntryType==='capsule'
            ? 'Dejar cápsula ♡'
            : 'Dejar carta ♡';

      }

    }
  );

  /* =======================================================
     ACTUALIZAR ESTADO DE CÁPSULAS
     ======================================================= */

  fetchLetters();

})();

</script>
