<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuestras cartas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#010b33;
  --card:#0a1540;
  --green:#7ee68c;
  --sage:#41558a;
  --ink:#eef2ff;
  --muted:#aeb9dd;
  --line:#263662;
  --light:#f1f3ff;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--paper);
  color:var(--ink);
  font:italic 700 16px/1.65 'Domine',Georgia,serif
}

body{
  overflow-x:hidden;
}

/* =========================
   FONDO ESTRELLADO
   ========================= */

.stars{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background:var(--paper);
}

.stars::before,
.stars::after{
  content:"";
  position:absolute;
  inset:0;
  image-rendering:pixelated;
}

/* Capa de estrellas pequeñas */

.stars::before{
  width:2px;
  height:2px;
  background:#eef2ff;
  box-shadow:
    7vw 8vh #eef2ff,
    15vw 18vh #eef2ff,
    23vw 6vh #eef2ff,
    31vw 25vh #eef2ff,
    39vw 12vh #eef2ff,
    48vw 7vh #eef2ff,
    56vw 22vh #eef2ff,
    65vw 11vh #eef2ff,
    73vw 29vh #eef2ff,
    82vw 7vh #eef2ff,
    91vw 18vh #eef2ff,
    96vw 34vh #eef2ff,

    5vw 42vh #eef2ff,
    14vw 55vh #eef2ff,
    21vw 38vh #eef2ff,
    29vw 62vh #eef2ff,
    37vw 47vh #eef2ff,
    46vw 56vh #eef2ff,
    54vw 40vh #eef2ff,
    63vw 67vh #eef2ff,
    72vw 49vh #eef2ff,
    81vw 59vh #eef2ff,
    89vw 43vh #eef2ff,
    97vw 72vh #eef2ff,

    9vw 81vh #eef2ff,
    18vw 92vh #eef2ff,
    27vw 76vh #eef2ff,
    36vw 88vh #eef2ff,
    45vw 79vh #eef2ff,
    57vw 94vh #eef2ff,
    68vw 83vh #eef2ff,
    78vw 91vh #eef2ff,
    87vw 77vh #eef2ff,
    95vw 89vh #eef2ff;

  animation:twinkleSmall 4.8s steps(2,end) infinite;
}

/* Capa de estrellas ligeramente mayores */

.stars::after{
  width:3px;
  height:3px;
  background:#dce6ff;
  box-shadow:
    12vw 12vh #dce6ff,
    27vw 17vh #dce6ff,
    44vw 28vh #dce6ff,
    61vw 15vh #dce6ff,
    78vw 21vh #dce6ff,
    93vw 9vh #dce6ff,

    8vw 64vh #dce6ff,
    25vw 52vh #dce6ff,
    42vw 72vh #dce6ff,
    59vw 48vh #dce6ff,
    76vw 69vh #dce6ff,
    92vw 57vh #dce6ff,

    16vw 86vh #dce6ff,
    33vw 96vh #dce6ff,
    52vw 85vh #dce6ff,
    71vw 95vh #dce6ff,
    88vw 82vh #dce6ff;

  animation:twinkleLarge 7s steps(3,end) infinite;
}

@keyframes twinkleSmall{
  0%,100%{
    opacity:.18;
  }
  20%{
    opacity:.8;
  }
  42%{
    opacity:.25;
  }
  67%{
    opacity:1;
  }
  84%{
    opacity:.35;
  }
}

@keyframes twinkleLarge{
  0%,100%{
    opacity:.7;
  }
  18%{
    opacity:.15;
  }
  38%{
    opacity:1;
  }
  59%{
    opacity:.3;
  }
  78%{
    opacity:.85;
  }
}

/* =========================
   CONTENIDO PRINCIPAL
   ========================= */

.hero,
main,
.bottom-hero{
  position:relative;
  z-index:1;
}

/* =========================
   CABECERA CON GIF
   ========================= */

.hero{
  position:relative;
  width:100%;
  height:330px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-gif{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  z-index:0;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(1,11,51,.10);
  z-index:1;
  pointer-events:none;
}

.head{
  position:relative;
  z-index:2;
  width:min(760px,100%);
  padding:30px 22px 20px;
  text-align:center;
  margin:0 auto;
}

.head h1{
  font-size:clamp(21px,3.8vw,28px);
  font-weight:700;
  color:#f3f2e9;
  margin:0 0 10px;
  text-shadow:0 2px 5px rgba(0,0,0,.55)
}

.head p{
  font-size:13px;
  letter-spacing:0;
  color:#f3f2e9;
  font-weight:400;
  font-style:italic;
  margin:0;
  text-shadow:0 2px 5px rgba(0,0,0,.65)
}

/* =========================
   CONTENIDO
   ========================= */

main{
  max-width:760px;
  margin:auto;
  padding:0 22px 20px
}

.actions{
  display:flex;
  justify-content:center;
  margin:34px 0 32px
}

.btn{
  font:inherit;
  font-size:14px;
  color:var(--ink);
  background:transparent;
  border:1px solid var(--sage);
  border-radius:999px;
  padding:11px 22px;
  cursor:pointer;
  transition:.2s;
  text-decoration:none;
  display:inline-block
}

.btn:hover{
  background:#101e4d
}

.letters{
  display:grid;
  grid-template-columns:1fr;
  gap:14px
}

.letter{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:8px;
  overflow:hidden
}

.letter summary{
  list-style:none;
  cursor:pointer;
  padding:20px;
  min-height:130px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:12px
}

.letter summary::-webkit-details-marker{
  display:none
}

.envtop{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.envicon{
  color:var(--green);
  font-size:28px
}

.date{
  font-size:12px;
  color:var(--muted)
}

.subject{
  font-size:15px;
  color:var(--ink)
}

.signature-preview{
  font-size:12px;
  color:var(--muted);
  font-weight:400;
  font-style:italic;
  margin-top:2px
}

.letter[open] summary{
  border-bottom:1px solid var(--line)
}

.letterbody{
  padding:22px;
  background:#050f38;
  color:#e7ebfa;
  font-weight:400;
  font-style:normal;
  white-space:pre-wrap
}

.sign{
  margin-top:18px;
  text-align:right;
  color:var(--green);
  font-weight:700;
  font-style:italic
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:36px 10px;
  grid-column:1/-1;
  font-size:14px
}

/* =========================
   GIF INFERIOR
   ========================= */

.bottom-hero{
  width:100%;
  height:330px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--paper);
}

.bottom-gif{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  image-rendering:pixelated;
}

/* =========================
   BOTÓN VOLVER
   ========================= */

.back{
  display:flex;
  justify-content:center;
  margin:52px 0 10px
}

/* =========================
   FORMULARIO
   ========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,4,22,.78);
  padding:20px;
  align-items:center;
  justify-content:center;
  z-index:5
}

.overlay.show{
  display:flex
}

.formcard{
  width:min(100%,540px);
  max-height:90vh;
  overflow:auto;
  background:#07123d;
  border:1px solid var(--line);
  border-radius:12px;
  padding:28px;
  box-shadow:0 18px 60px rgba(0,0,0,.45)
}

.formhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}

.formhead h2{
  font-size:22px;
  margin:0;
  color:var(--ink)
}

.close{
  border:0;
  background:none;
  color:var(--green);
  font:inherit;
  font-size:24px;
  cursor:pointer
}

.field{
  display:block;
  margin:17px 0 7px;
  color:var(--ink)
}

.formcard input,
.formcard textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:6px;
  background:#020c32;
  padding:12px;
  color:var(--ink);
  font:400 15px/1.6 'Domine',Georgia,serif
}

.formcard input::placeholder,
.formcard textarea::placeholder{
  color:#7785ad
}

.formcard textarea{
  min-height:170px;
  resize:vertical
}

.formbuttons{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:20px
}

.hint{
  font:400 12px/1.5 'Domine',Georgia,serif;
  color:var(--muted);
  margin-top:12px
}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#172b68;
  color:#f1f3ff;
  padding:10px 16px;
  border:1px solid #354b83;
  border-radius:99px;
  font:400 13px 'Domine',Georgia,serif;
  display:none
}

.toast.show{
  display:block
}

/* =========================
   MÓVIL
   ========================= */

@media(max-width:520px){

  .hero{
    height:285px;
  }

  .hero-gif{
    object-position:center center;
  }

  .head{
    padding:24px 18px 18px;
  }

  .head h1{
    font-size:21px;
    margin-bottom:9px;
  }

  .head p{
    font-size:12px;
    line-height:1.6;
  }

  main{
    padding:0 22px 20px;
  }

  .actions{
    margin:30px 0 30px;
  }

  .letters{
    grid-template-columns:1fr;
  }

  .letter summary{
    min-height:110px;
  }

  .bottom-hero{
    height:310px;
  }

  .bottom-gif{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .back{
    margin-top:48px;
  }
}
</style>
</head>

<body>

<!-- FONDO DINÁMICO -->
<div class="stars" aria-hidden="true"></div>

<!-- CABECERA -->

<section class="hero">

  <img
    class="hero-gif"
    src="fondo-cartas.gif"
    alt=""
    aria-hidden="true"
  >

  <header class="head">
    <h1>NUESTRAS ✉︎ CARTAS</h1>
    <p>Para esas palabras que son importantes, y queremos que el otro encuentre algún día.</p>
  </header>

</section>

<!-- CONTENIDO -->

<main>

<div class="actions">
  <button class="btn" id="openForm">＋ Escribir una carta</button>
</div>

<section class="letters" id="letters" aria-live="polite">
  <p class="empty">Cargando vuestras cartas…</p>
</section>

<div class="back">
  <a class="btn" href="https://blancamia.wordpress.com">← Volver</a>
</div>

</main>

<!-- GIF INFERIOR -->

<section class="bottom-hero">
  <img
    class="bottom-gif"
    src="kirby_stars_transparent.gif"
    alt=""
    aria-hidden="true"
  >
</section>

<!-- FORMULARIO -->

<div class="overlay" id="overlay">

<form class="formcard" id="letterForm">

<div class="formhead">
  <h2>Escribir una carta</h2>
  <button type="button" class="close" id="closeForm" aria-label="Cerrar">×</button>
</div>

<label class="field" for="title">Título de la carta</label>
<input id="title" name="title" type="text" placeholder="Ponle un título a tu carta" maxlength="70" required>

<label class="field" for="date">¿Qué día escribes esto?</label>
<input id="date" name="date" type="date" required>

<label class="field" for="message">Escribe tu carta</label>
<textarea id="message" name="message" placeholder="Escribe aquí todo lo que quieras contar…" required></textarea>

<label class="field" for="signature">Firma</label>
<input id="signature" name="signature" type="text" placeholder="Tu firma" required>

<p class="hint">
  Al guardar, la carta aparecerá la primera en el buzón.
</p>

<div class="formbuttons">
  <button type="button" class="btn" id="cancel">Cancelar</button>
  <button class="btn" type="submit">Guardar carta ♡</button>
</div>

</form>

</div>

<div class="toast" id="toast">
  Carta añadida a esta vista de prueba
</div>

<script>
(()=>{

const SUPABASE_URL="https://opswexuksplsysgtmajz.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_OJ4xv5YVnCyLNA6L9P8D4w_M4s2AkBz";
const API_URL=`${SUPABASE_URL}/rest/v1/letters`;

const headers={
  apikey:SUPABASE_ANON_KEY,
  Authorization:`Bearer ${SUPABASE_ANON_KEY}`
};

const overlay=document.getElementById('overlay');
const form=document.getElementById('letterForm');
const letters=document.getElementById('letters');

let savedLetters=[];

function formatDate(value){
  if(!value)return '';
  const parts=value.split('-');
  return `${parts[2]}/${parts[1]}/${parts[0]}`
}

function makeCard(item){

  const card=document.createElement('details');
  card.className='letter';

  const summary=document.createElement('summary');

  const top=document.createElement('div');
  top.className='envtop';

  const icon=document.createElement('span');
  icon.className='envicon';
  icon.textContent='✉';

  const dt=document.createElement('span');
  dt.className='date';
  dt.textContent=formatDate(item.date);

  top.append(icon,dt);

  const subject=document.createElement('span');
  subject.className='subject';
  subject.textContent=item.title;

  const signaturePreview=document.createElement('span');
  signaturePreview.className='signature-preview';
  signaturePreview.textContent='— '+item.signature;

  summary.append(top,subject,signaturePreview);

  const body=document.createElement('div');
  body.className='letterbody';
  body.append(document.createTextNode(item.message));

  const sign=document.createElement('div');
  sign.className='sign';
  sign.textContent='— '+item.signature;

  body.append(sign);
  card.append(summary,body);

  return card
}

function renderLetters(){

  letters.replaceChildren();

  if(!savedLetters.length){

    const empty=document.createElement('p');
    empty.className='empty';
    empty.textContent='Todavía no hay cartas. Podéis escribir la primera ♡';

    letters.append(empty);
    return
  }

  savedLetters.forEach(item=>letters.append(makeCard(item)))
}

async function fetchLetters(){

  letters.innerHTML='<p class="empty">Cargando vuestras cartas…</p>';

  try{

    const response=await fetch(
      `${API_URL}?select=id,title,letter_date,message,signature,created_at&order=created_at.desc`,
      {
        headers:{
          ...headers,
          Accept:'application/json'
        }
      }
    );

    if(!response.ok){

      const detail=await response.text();
      throw new Error(`Supabase (${response.status}): ${detail}`)
    }

    const data=await response.json();

    savedLetters=data.map(row=>({
      id:row.id,
      title:row.title,
      date:row.letter_date,
      message:row.message,
      signature:row.signature,
      createdAt:new Date(row.created_at).getTime()
    }));

    renderLetters()

  }catch(error){

    letters.innerHTML='<p class="empty">No se han podido cargar las cartas. Comprueba la conexión e inténtalo de nuevo.</p>';

    console.error('Error al cargar las cartas:',error)
  }
}

function show(){
  overlay.classList.add('show')
}

function hide(){
  overlay.classList.remove('show')
}

document.getElementById('openForm').addEventListener('click',show);
document.getElementById('closeForm').addEventListener('click',hide);
document.getElementById('cancel').addEventListener('click',hide);

overlay.addEventListener('click',e=>{
  if(e.target===overlay)hide()
});

form.addEventListener('submit',async e=>{

  e.preventDefault();

  if(!form.reportValidity())return;

  const submitButton=form.querySelector('button[type="submit"]');

  submitButton.disabled=true;
  submitButton.textContent='Guardando…';

  const item={
    title:document.getElementById('title').value.trim(),
    letter_date:document.getElementById('date').value,
    message:document.getElementById('message').value.trim(),
    signature:document.getElementById('signature').value.trim()
  };

  try{

    const response=await fetch(
      API_URL,
      {
        method:'POST',
        headers:{
          ...headers,
          'Content-Type':'application/json',
          Prefer:'return=minimal'
        },
        body:JSON.stringify(item)
      }
    );

    if(!response.ok){

      const detail=await response.text();
      throw new Error(`Supabase (${response.status}): ${detail}`)
    }

    form.reset();
    hide();

    await fetchLetters();

    const toast=document.getElementById('toast');

    toast.textContent='Carta guardada en vuestro buzón ♡';
    toast.classList.add('show');

    setTimeout(()=>{
      toast.classList.remove('show')
    },2400)

  }catch(error){

    console.error('Error al guardar la carta:',error);

    alert(
      'No se ha podido guardar la carta. Comprueba la conexión e inténtalo de nuevo.'
    );

  }finally{

    submitButton.disabled=false;
    submitButton.textContent='Guardar carta ♡'
  }

});

fetchLetters();

})();
</script>

</body>
</html>
